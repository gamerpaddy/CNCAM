<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CNCAM tests</title>
  <!-- The UI tests drive real elements, and an element's geometry is its CSS:
       without the stylesheet a fixed-position menu lays out in normal flow and
       every measurement taken of it is of something the app never renders. -->
  <link rel="stylesheet" href="src/app/styles.css">
  <style>
    /* the app stylesheet pins the shell to the window and hides overflow; the
       test log is a long scrolling page, so take that back */
    html, body { height: auto; overflow: auto; }
    body { font: 13px/1.5 Consolas, monospace; background: #1c1e22; color: #d6d8dd; padding: 16px; }
    .pass { color: #6ecf6e; }
    .fail { color: #ff5c5c; }
  </style>
</head>
<body>
  <h3>CNCAM unit tests</h3>
  <pre id="out"></pre>
  <script type="module">
    import { run } from './src/test/all.js';
    const out = document.getElementById('out');
    await run((line) => {
      const div = document.createElement('div');
      div.textContent = line;
      if (line.startsWith('PASS')) div.className = 'pass';
      if (line.startsWith('FAIL')) div.className = 'fail';
      out.appendChild(div);
    });
  </script>
</body>
</html>
